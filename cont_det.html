<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="cont_sty.css">
  <title> Request Page</title>
</head>

<body>
  <!DOCTYPE html>
  <html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get in Touch</title>
    <link rel="stylesheet" href="cont_style.css">
  </head>

  <body>
    <form action="https://api.web3forms.com/submit" method="POST" id="form">
      <fieldset>

        <input type="hidden" name="access_key" value="b04b85d4-f50b-4e41-b52e-dd9546e5368c" />
        <input type="hidden" name="subject" value="New Submission from Web3Forms" />
        <input type="hidden" name="redirect" value="https://web3forms.com/success" />
        <form>
          <section class="contact-section">
            <div class="contact-intro">
              <h2 class="contact-title">Get in Touch</h2>
              <p class="contact-description">
                Fill out the form below and I'll get back to you as soon as possible.
              </p>
            </div>
            <div class="form-group-container">
              <div class="form-group">
                <label for="name" class="form-label">Name</label>
                <input id="name" name="name" class="form-input" placeholder="Your name" type="text" minlength="6"
                  maxlength="15" required />
              </div>
              <div class="form-group">
                <label for="email" class="form-label">Email</label>
                <input id="email" name="email" class="form-input" placeholder="Your email" type="email" minlength="6"
                  maxlength="15" required />
              </div>
              <div class="form-group">
                <label for="phone" class="form-label">Phone</label>
                <input id="phone" name="phone" class="form-input" placeholder="+91 " type="tel" minlength="6"
                  maxlength="15"  required />
              </div>
              <div class="form-group">
                <label for="message" class="form-label">Message</label>
                <textarea class="form-textarea" id="message" name="message" placeholder="Your message"></textarea>
              </div>
            </div>
            <button class="form-submit" type="submit">Submit</button>
            <button class="form-reset" type="reset">Reset</button>


        </form>

        </section>
  </body>

  </html>


</body>

</html>
